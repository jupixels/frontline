<!doctype html>
<!-- Dev-only model viewer (not part of the build). Run `npm run dev` and open /tools/viewer.html.
     Shows every model in public/assets/models/catalog.json on a 1 m grid. The red arrow under each
     model points to +Z, which is where vehicles should face. ?kind=unit|building|prop|env filters,
     ?id=<id> shows one model with a clip picker, ?ids=a,b,c a few. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frontline model viewer</title>
    <style>
      body { margin: 0; overflow: hidden; background: #1d2024; font: 13px system-ui, sans-serif; color: #ddd; }
      #ui { position: fixed; top: 8px; left: 8px; background: #000a; padding: 8px; border-radius: 6px; }
      .label { color: #fff; background: #0008; padding: 1px 4px; border-radius: 3px; font-size: 11px; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="ui">
      <select id="kind"><option value="">all</option><option>unit</option><option>building</option><option>prop</option><option>env</option></select>
      <select id="model"><option value="">(grid)</option></select>
      <select id="clip"></select>
      <span id="info"></span>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

      const params = new URLSearchParams(location.search);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);
      const labels = new CSS2DRenderer();
      labels.setSize(innerWidth, innerHeight);
      Object.assign(labels.domElement.style, { position: 'fixed', top: 0, pointerEvents: 'none' });
      document.body.appendChild(labels.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
      const controls = new OrbitControls(camera, renderer.domElement);
      new RGBELoader().load('/assets/textures/sky/sky.hdr', (tex) => {
        tex.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = tex;
        scene.background = tex;
      });
      const sun = new THREE.DirectionalLight(0xffffff, 2);
      sun.position.set(30, 50, 20);
      sun.castShadow = true;
      Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 150, bottom: -150, far: 400 });
      sun.shadow.mapSize.set(2048, 2048);
      scene.add(sun);

      // Ground: the grass terrain set, so the textures get a look too.
      const tl = new THREE.TextureLoader();
      const tex = (n, srgb) => {
        const t = tl.load(`/assets/textures/terrain/${params.get('terrain') ?? 'grass'}_${n}.webp`);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(200, 200);
        if (srgb) t.colorSpace = THREE.SRGBColorSpace;
        return t;
      };
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(800, 800).rotateX(-Math.PI / 2),
        new THREE.MeshStandardMaterial({ map: tex('albedo', true), normalMap: tex('normal'), roughnessMap: tex('rough') }),
      );
      ground.receiveShadow = true;
      scene.add(ground);
      const grid = new THREE.GridHelper(800, 800, 0x000000, 0x000000);
      grid.material.opacity = 0.12;
      grid.material.transparent = true;
      grid.position.y = 0.01;
      scene.add(grid);

      const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      const { models } = await (await fetch('/assets/models/catalog.json')).json();
      const kindSel = document.getElementById('kind'), modelSel = document.getElementById('model'), clipSel = document.getElementById('clip');
      kindSel.value = params.get('kind') ?? '';
      for (const m of models) modelSel.add(new Option(`${m.id} (${m.kind})`, m.id));
      modelSel.value = params.get('id') ?? '';
      const nav = () => {
        const q = new URLSearchParams();
        if (kindSel.value) q.set('kind', kindSel.value);
        if (modelSel.value) q.set('id', modelSel.value);
        location.search = q.toString();
      };
      kindSel.onchange = modelSel.onchange = nav;

      const ids = params.get('ids')?.split(',');
      const shown = models.filter((m) => (!params.get('id') || m.id === params.get('id')) && (!ids || ids.includes(m.id)) && (!params.get('kind') || m.kind === params.get('kind')));
      const mixers = [];
      let x = 0, rowZ = 0, rowDepth = 0, maxX = 0;
      const rowWidth = shown.length > 1 ? Math.max(40, Math.sqrt(shown.reduce((a, m) => a + (m.size[0] + 6) * (m.size[2] + 6), 0)) * 1.3) : 0;
      for (const m of shown) {
        const gltf = await loader.loadAsync('/assets/' + m.path);
        const [w, h, d] = m.size;
        if (x > 0 && x + w > rowWidth) {
          x = 0;
          rowZ += rowDepth + 6;
          rowDepth = 0;
        }
        const g = new THREE.Group();
        g.position.set(x + w / 2, 0, rowZ + d / 2);
        g.add(gltf.scene);
        gltf.scene.traverse((o) => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });
        const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.05, 0), Math.max(d / 2 + 1.5, 2), 0xff3030, 1, 0.6);
        g.add(arrow);
        const div = document.createElement('div');
        div.className = 'label';
        div.textContent = `${m.id} ${w}×${h}×${d}`;
        const label = new CSS2DObject(div);
        label.position.set(0, h + 0.5, 0);
        g.add(label);
        scene.add(g);
        if (gltf.animations.length) {
          const mixer = new THREE.AnimationMixer(gltf.scene);
          mixers.push(mixer);
          const play = (name) => {
            mixer.stopAllAction();
            const clip = gltf.animations.find((c) => c.name === name) ?? gltf.animations[0];
            mixer.clipAction(clip).play();
          };
          if (shown.length === 1) {
            for (const c of gltf.animations) clipSel.add(new Option(c.name, c.name));
            clipSel.onchange = () => play(clipSel.value);
            document.getElementById('info').textContent = `${m.sizeKB} KB · ${m.license} · nodes: ${m.nodes.join(', ') || '-'}`;
          }
          play(['Idle', 'MilitaryIdle01', 'Idle_Rotors', 'Fly'].find((n) => gltf.animations.some((c) => c.name === n)));
        }
        x += w + 6;
        maxX = Math.max(maxX, x);
        rowDepth = Math.max(rowDepth, d);
      }
      const cx = maxX / 2, cz = (rowZ + rowDepth) / 2, span = Math.max(maxX, rowZ + rowDepth, 4);
      controls.target.set(cx, 0, cz);
      camera.position.set(cx + span * 0.5, span * 0.7, cz + span * 0.9);
      controls.update();

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        for (const m of mixers) m.update(dt);
        renderer.render(scene, camera);
        labels.render(scene, camera);
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        labels.setSize(innerWidth, innerHeight);
      });
      window.viewer = { scene, camera, controls };
    </script>
  </body>
</html>
